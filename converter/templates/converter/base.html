{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Recalloom{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'converter/app.css' %}">
  <script src="{% static 'converter/app.js' %}" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="{% url 'home' %}"><span class="brand-mark" aria-hidden="true">r<span>↗</span></span>Recalloom</a>
  <nav class="topbar-actions" aria-label="Workspace"><a class="text-button" href="{% url 'codex_connection' %}">Codex connection</a><span class="local-label"><span class="dot"></span> Your local workspace</span></nav>
</header>
<main id="main">{% block content %}{% endblock %}</main>
<footer class="footer">Built for the next lecture. <span>Your cards, your files, your choice.</span></footer>
</body></html>
